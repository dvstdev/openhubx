name: Debug APK

# Build the debug APK and run unit tests on every push (any branch tip).
on:
  push:
  workflow_dispatch:

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: ./gradlew assembleNormalDebug testNormalDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: openhubx-debug-${{ github.ref_name }}-${{ github.sha }}
          path: app/build/outputs/apk/normal/debug/*.apk
          if-no-files-found: error

  # End-to-end tests on an emulator (see vibes/test-plan.md). Play Store image: it has Chrome,
  # which the browser-login tests need. No GitHub token is given to CI, so the signed-in
  # tests (AccountE2eTest) are skipped here; run them locally with GH_TOKEN.
  # Runs after the build job and never changes it, so the debug APK is built either way.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      # The emulator sometimes fails to boot on hosted runners, so try once more if needed.
      - name: Run e2e tests
        id: e2e1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/e2e/run-e2e.sh

      - name: Run e2e tests (retry)
        if: steps.e2e1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/e2e/run-e2e.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openhubx-e2e-report-${{ github.sha }}
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
