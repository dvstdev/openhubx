name: Debug APK

# Build the debug APK and run unit tests on every push (any branch tip).
on:
  push:
  workflow_dispatch:

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: ./gradlew assembleNormalDebug testNormalDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: openhubx-debug-${{ github.ref_name }}-${{ github.sha }}
          path: app/build/outputs/apk/normal/debug/*.apk
          if-no-files-found: error
