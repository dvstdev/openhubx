# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# AndroidX migration (P2b)
android.useAndroidX=true
android.enableJetifier=false
# AGP 8 makes app-module R fields non-final by default, but this codebase uses
# switch/case on R.id.* (menu/nav handlers), which requires constant R values.
# Keep final R IDs until those switches are refactored to if/else.
android.nonFinalResIds=false

