
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // jcenter-only artifacts (jcenter shut down), vendored in-repo. See third_party/README.md.
        maven {
            url rootProject.file('third_party/maven')
            content {
                includeGroupByRegex 'com\\.zzhoujay(\\..*)?'
            }
        }
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
